<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>stills · muhib waqar</title>
  <meta name="description" content="a wall of moments — stills and clips, dropped in as they happen." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/site.css" />
</head>
<body>
  <div class="container">
    <header class="masthead">
      <figure class="morph-mini" aria-hidden="true">
        <div class="morph-mini-stage"><pre class="morph-art" id="morph-art"></pre></div>
      </figure>
      <nav class="masthead-nav" aria-label="primary">
        <h1 class="masthead-title"><a href="/">muhib waqar</a></h1>
        <ul>
          <li><a href="/books/">compelling content</a></li>
          <li><a href="/endeavours/">endeavours</a></li>
          <li><a class="here" href="/stills/">stills</a></li>
          <li><a href="/my-purpose/">my purpose</a></li>
        </ul>
      </nav>
    </header>

    <article class="content post photos">
      <h1 class="page-title">stills</h1>
      <nav class="photo-views" aria-label="photo views">
        <button type="button" class="photo-view here" data-view="inspiration">inspiration</button>
        <button type="button" class="photo-view" data-view="memories">memories</button>
      </nav>
      <div class="board" id="board"></div>
    </article>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" type="button">close</button>
  </div>

  <script type="module" src="/site.js"></script>
  <script type="module">
    const board = document.getElementById("board");
    const lightbox = document.getElementById("lightbox");
    const views = document.querySelector(".photo-views");
    let items = [];
    let view = "inspiration";

    const render = () => {
      const list = items.filter((i) => i.tag === view);
      board.innerHTML = list.map((item) => {
        const src = item.thumb || item.src;
        const cap = item.cap ? `<figcaption class="polaroid-cap">${item.cap}</figcaption>` : "";
        return `<figure class="polaroid" data-media="${item.type}" data-src="${item.src}">
          <div class="polaroid-media"><img src="${src}" alt="${item.cap || ""}" loading="lazy" /></div>
          ${cap}
        </figure>`;
      }).join("") || `<p class="photos-empty">no ${view} yet</p>`;
    };

    fetch("/photos/manifest.json")
      .then((r) => r.json())
      .then((data) => {
        items = data;
        render();
      })
      .catch(() => {
        board.innerHTML = `<p class="photos-empty">couldn't load the photo wall</p>`;
      });

    views.addEventListener("click", (e) => {
      const btn = e.target.closest(".photo-view");
      if (!btn) return;
      view = btn.dataset.view;
      views.querySelectorAll(".photo-view").forEach((b) => b.classList.toggle("here", b === btn));
      render();
    });

    board.addEventListener("click", (e) => {
      const card = e.target.closest(".polaroid");
      if (!card) return;
      const { media, src } = card.dataset;
      const el = document.createElement(media === "video" ? "video" : "img");
      if (media === "video") {
        el.src = src;
        el.controls = true;
        el.autoplay = true;
        el.playsInline = true;
      } else {
        el.src = src;
        el.alt = "";
      }
      lightbox.querySelectorAll("img, video").forEach((n) => n.remove());
      lightbox.appendChild(el);
      lightbox.classList.add("open");
    });

    const close = () => {
      lightbox.classList.remove("open");
      lightbox.querySelectorAll("video").forEach((v) => v.pause());
    };
    document.getElementById("lightbox-close").addEventListener("click", close);
    lightbox.addEventListener("click", (e) => { if (e.target === lightbox) close(); });
    addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  </script>
</body>
</html>
