<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>photos · muhib waqar</title>
  <meta name="description" content="a wall of moments — photos and clips, dropped in as they happen." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=art2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
</head>
<body class="photos-dark">
  <div class="container">
    <header class="masthead">
      <nav class="masthead-nav" aria-label="primary">
        <h1 class="masthead-title"><a class="masthead-home" href="/" aria-label="muhib waqar — home">
        <figure class="morph-mini" aria-hidden="true">
          <div class="morph-mini-stage"><pre class="morph-art" id="morph-art"></pre></div>
        </figure>
          <span class="home-label" aria-hidden="true">home</span>
        </a></h1>
        <ul>
          <li><a href="/projects/">projects</a></li>
          <li><a href="/community/">community</a></li>
          <li><a href="/books/">compelling content</a></li>
        </ul>
      </nav>
    </header>

    <article class="content post photos">
      <a class="photos-back" href="/" aria-label="back home">←</a>
      <div class="board" id="board"></div>
    </article>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" type="button">close</button>
  </div>

  <script type="module" src="/site.js"></script>
  <script type="module">
    const board = document.getElementById("board");
    const lightbox = document.getElementById("lightbox");

    fetch("/photos/manifest.json")
      .then((r) => r.json())
      .then((items) => {
        const list = items.filter((i) => i.tag === "memories");
        board.innerHTML = list.map((item) => {
          const src = item.thumb || item.src;
          const cap = `<figcaption class="shot-cap"><span>${item.cap || ""}</span><span>${item.cam || ""}</span></figcaption>`;
          return `<figure class="shot" data-media="${item.type}" data-src="${item.src}">
            <img src="${src}" alt="${item.cap || ""}" loading="lazy" decoding="async" />
            ${cap}
          </figure>`;
        }).join("") || `<p class="photos-empty">no photos yet</p>`;
      })
      .catch(() => {
        board.innerHTML = `<p class="photos-empty">couldn't load the photo wall</p>`;
      });

    board.addEventListener("click", (e) => {
      const card = e.target.closest(".shot");
      if (!card) return;
      const { media, src } = card.dataset;
      const el = document.createElement(media === "video" ? "video" : "img");
      if (media === "video") {
        el.src = src;
        el.controls = true;
        el.autoplay = true;
        el.playsInline = true;
      } else {
        el.src = src;
        el.alt = "";
      }
      lightbox.querySelectorAll("img, video").forEach((n) => n.remove());
      lightbox.appendChild(el);
      lightbox.classList.add("open");
    });

    const close = () => {
      lightbox.classList.remove("open");
      lightbox.querySelectorAll("video").forEach((v) => v.pause());
    };
    document.getElementById("lightbox-close").addEventListener("click", close);
    lightbox.addEventListener("click", (e) => { if (e.target === lightbox) close(); });
    addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  </script>
</body>
</html>
