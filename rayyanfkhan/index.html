<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rayyan f khan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=art2" />
  <style>
    html, body { margin: 0; height: 100%; background: #1c1c1f; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 100svh; }
    h1 { margin: 0; font: 500 18px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.01em; color: #f3cf74; }
    .px-grid { display: block; height: calc(100svh - 90px); max-width: calc(100vw - 32px); width: auto; object-fit: contain; }
    .px-src { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <h1>we &lt;3 foundersarm</h1>
  <canvas class="px-grid" data-cols="63" data-rows="112" data-cell="6" data-gap="2" role="img" aria-label="goldfish swimming, drawn as gold pixels"></canvas>
  <video class="px-src" src="/photos/goldfish-vertical.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
  <script type="module">
    // the original vertical goldfish video, drawn as gold pixels
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const video = document.querySelector(".px-src"), cv = document.querySelector(".px-grid");
    const d = cv.dataset, cols = +d.cols, rows = +d.rows, cell = +d.cell, gap = +d.gap, step = cell + gap;
    const dpr = Math.min(devicePixelRatio || 1, 2), W = cols * step - gap, H = rows * step - gap;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.aspectRatio = W + " / " + H;
    const ctx = cv.getContext("2d", { alpha: false }); ctx.scale(dpr, dpr);
    // the dim empty grid never changes, so draw it once and copy it each frame
    const base = document.createElement("canvas"); base.width = cv.width; base.height = cv.height;
    const bctx = base.getContext("2d"); bctx.scale(dpr, dpr);
    bctx.fillStyle = "#1c1c1f"; bctx.fillRect(0, 0, W, H); bctx.fillStyle = "#2c2c2f";
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) bctx.rect(c * step, r * step, cell, cell);
    bctx.fill();
    // gaps between cells, in the background colour, laid over the scaled-up frame
    const mask = document.createElement("canvas"); mask.width = cv.width; mask.height = cv.height;
    const mctx = mask.getContext("2d"); mctx.scale(dpr, dpr); mctx.fillStyle = "#1c1c1f";
    for (let c = 1; c < cols; c++) mctx.fillRect(c * step - gap, 0, gap, H);
    for (let r = 1; r < rows; r++) mctx.fillRect(0, r * step - gap, W, gap);
    // one pixel per cell: the frame is coloured at video size, then scaled up with no smoothing
    const sc = document.createElement("canvas"); sc.width = cols; sc.height = rows;
    const sctx = sc.getContext("2d", { willReadFrequently: true });
    const gold = document.createElement("canvas"); gold.width = cols; gold.height = rows;
    const gctx = gold.getContext("2d"), out = gctx.createImageData(cols, rows), lum = new Float32Array(cols * rows);
    ctx.imageSmoothingEnabled = false;
    const draw = () => {
      if (video.readyState < 2) return ctx.drawImage(base, 0, 0, W, H);
      sctx.drawImage(video, 0, 0, cols, rows);
      const px = sctx.getImageData(0, 0, cols, rows).data, o = out.data; let lo = 1, hi = 0;
      for (let i = 0; i < lum.length; i++) { const v = (0.2126 * px[i * 4] + 0.7152 * px[i * 4 + 1] + 0.0722 * px[i * 4 + 2]) / 255; lum[i] = v; if (v < lo) lo = v; if (v > hi) hi = v; }
      const span = Math.max(hi - lo, 1e-3);
      for (let i = 0; i < lum.length; i++) {
        const a = Math.pow((lum[i] - lo) / span, 1.6), j = i * 4;
        const t = a * 0.98, u = 1 - t; // gold over the dim empty cell, so each frame is fully opaque
        o[j] = 44 * u + 255 * t; o[j + 1] = 44 * u + (150 + 70 * a) * t; o[j + 2] = 47 * u + (40 + 60 * a * a) * t; o[j + 3] = 255;
      }
      gctx.putImageData(out, 0, 0);
      ctx.drawImage(gold, 0, 0, cols * step, rows * step);
      ctx.drawImage(mask, 0, 0, W, H);
    };
    // redraw only when the video has a new frame (25 fps), not on every screen refresh
    const rvfc = "requestVideoFrameCallback" in HTMLVideoElement.prototype;
    let pending = false;
    const tick = () => { pending = false; draw(); schedule(); };
    const schedule = () => {
      if (pending || video.paused || document.hidden) return; pending = true;
      rvfc ? video.requestVideoFrameCallback(tick) : requestAnimationFrame(tick);
    };
    video.addEventListener("play", schedule);
    video.addEventListener("loadeddata", draw);
    document.addEventListener("visibilitychange", schedule);
    if (reduced) video.pause(); else video.play().catch(() => {});
    draw();
  </script>
</body>
</html>
