<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rayyan f khan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=art2" />
  <style>
    html, body { margin: 0; height: 100%; background: #1c1c1f; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 100svh; }
    h1 { margin: 0; font: 500 18px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.01em; color: #f3cf74; }
    .px-grid { display: block; height: calc(100svh - 90px); max-width: calc(100vw - 32px); width: auto; object-fit: contain; }
    .px-src { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <h1>we &lt;3 foundersarm</h1>
  <canvas class="px-grid" data-cols="63" data-rows="112" data-cell="6" data-gap="2" role="img" aria-label="goldfish swimming, drawn as gold pixels"></canvas>
  <video class="px-src" src="/photos/goldfish-vertical.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
  <script type="module">
    // the original vertical goldfish video, drawn as gold pixels
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const video = document.querySelector(".px-src"), cv = document.querySelector(".px-grid");
    const d = cv.dataset, cols = +d.cols, rows = +d.rows, cell = +d.cell, gap = +d.gap;
    const dpr = Math.min(devicePixelRatio || 1, 2), W = cols * (cell + gap) - gap, H = rows * (cell + gap) - gap;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.aspectRatio = W + " / " + H;
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    const sc = document.createElement("canvas"); sc.width = cols; sc.height = rows;
    const sctx = sc.getContext("2d", { willReadFrequently: true }), lum = new Float32Array(cols * rows);
    const sample = () => {
      if (video.readyState < 2) return null;
      sctx.drawImage(video, 0, 0, cols, rows);
      const px = sctx.getImageData(0, 0, cols, rows).data; let lo = 1, hi = 0;
      for (let i = 0; i < lum.length; i++) { const v = (0.2126 * px[i * 4] + 0.7152 * px[i * 4 + 1] + 0.0722 * px[i * 4 + 2]) / 255; lum[i] = v; lo = Math.min(lo, v); hi = Math.max(hi, v); }
      for (let i = 0; i < lum.length; i++) lum[i] = Math.pow(Math.max(0, (lum[i] - lo) / Math.max(hi - lo, 1e-3)), 1.6);
      return lum;
    };
    const draw = () => {
      ctx.clearRect(0, 0, W, H);
      const s = sample();
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const a = s ? s[r * cols + c] : 0, x = c * (cell + gap), y = r * (cell + gap);
        ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fillRect(x, y, cell, cell);
        ctx.fillStyle = `rgba(255,${(150 + 70 * a) | 0},${(40 + 60 * a * a) | 0},${(a * 0.98).toFixed(3)})`;
        ctx.fillRect(x, y, cell, cell);
      }
    };
    let raf = 0;
    const loop = () => { draw(); raf = !video.paused && !document.hidden ? requestAnimationFrame(loop) : 0; };
    video.addEventListener("play", () => { if (!raf) raf = requestAnimationFrame(loop); });
    video.addEventListener("loadeddata", draw);
    if (reduced) video.pause(); else video.play().catch(() => {});
    draw();
  </script>
</body>
</html>
